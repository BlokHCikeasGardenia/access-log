<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      // SPA fallback for GitHub Pages (history mode).
      // When a route like /residents is requested directly, GitHub Pages
      // serves this 404.html. We redirect to the root with the original
      // path stored in the ?p= query parameter, then main.ts restores
      // the URL so Vue Router picks up the correct route.
      var l = window.location;
      var pathSegmentsToKeep = 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? l.search : '') +
        (l.hash ? l.hash : '')
      );
    </script>
  </body>
</html>
